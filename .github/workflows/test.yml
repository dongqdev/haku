name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Run tests
        shell: bash
        run: node --test tests/*.test.js
  version:
    # Installed plugin copies are keyed by version, so shipped changes must raise it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.js origin/${{ github.base_ref }}
